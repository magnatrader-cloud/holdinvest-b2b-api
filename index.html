<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Holdinvest B2B - Panel de Control</title>
</head>
<body>

    <h1>💼 BIDAccess B2B/B2C Platform</h1>
    <p>API Conectada</p>

    <hr>

    <!-- 1. SECCIÓN DE BÚSQUEDA (Movida arriba para facilitar el acceso al usuario) -->
    <h2>🔍 Buscar Empresas</h2>
    
    <form id="formBusqueda" action="" method="GET">
        <!-- Barra de búsqueda simple -->
        <input type="text" name="buscar" placeholder="Buscar empresas..." autocomplete="off">
        <button type="submit">Buscar</button>
        
        <!-- Contenedor invisible para que JavaScript inserte sugerencias en el futuro -->
        <div id="sugerenciasBusqueda" style="display: none;"></div>

        <br><br>

        <!-- Filtros rápidos utilizando tus opciones originales -->
        <label>Filtrar por Tamaño:</label>
        <select name="filtroTamano">
            <option value="todos">Todos los tamaños</option>
            <option value="pequena">Pequeña</option>
            <option value="mediana">Mediana</option>
            <option value="grande">Grande</option>
        </select>
    </form>

    <h3>Resultados comerciales</h3>
    <!-- Contenedor de resultados original -->
    <div id="resultadosBusqueda">
        <p>0 Encontradas</p>
    </div>

    <hr>

    <!-- 2. SECCIÓN DE REGISTRO (Mantenida exactamente igual en campos y textos) -->
    <h2>➕ Registrar Nueva Empresa</h2>
    
    <form id="formRegistro" action="" method="POST">
        <p>
            <label>Razón Social:</label><br>
            <input type="text" name="razonSocial">
        </p>
        
        <p>
            <label>Identificador Fiscal (RIF/NIT):</label><br>
            <input type="text" name="rifNit">
        </p>

        <p>
            <label>Tipo:</label><br>
            <input type="radio" name="tipo" value="tecnologia"> Tecnología<br>
            <input type="radio" name="tipo" value="manufactura"> Manufactura<br>
            <input type="radio" name="tipo" value="servicios"> Servicios<br>
            <input type="radio" name="tipo" value="comercio"> Comercio
        </p>

        <p>
            <label>Tamaño:</label><br>
            <input type="radio" name="tamano" value="pequena"> Pequeña<br>
            <input type="radio" name="tamano" value="mediana"> Mediana<br>
            <input type="radio" name="tamano" value="grande"> Grande
        </p>

        <p>
            <label>Ciudad Piloto:</label><br>
            <input type="text" name="ciudadPiloto">
        </p>

        <p>
            <label>Dirección Específica:</label><br>
            <textarea name="direccionEspecifica"></textarea>
        </p>

        <button type="submit">Solicitar Afiliación</button>
    </form>

</body>
</html>
