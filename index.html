<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdinvest B2B - Panel de Control</title>
    <!-- CSS enlazado del backend original -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- Encabezado / Navbar -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            💼 BIDAccess B2B/B2C Platform
        </h1>
        <span class="bg-green-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider text-white">
            API Conectada
        </span>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- SECCIÓN IZQUIERDA: Formulario de Registro -->
        <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 md:col-span-1">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-1">
                ➕ Registrar Nueva Empresa
            </h2>
            
            <form id="formEmpresa" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Razón Social</label>
                    <input type="text" placeholder="Ej. Inversiones Alfa C.A." class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-blue-500" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Identificador Fiscal (RIF/NIT)</label>
                    <input type="text" placeholder="Ej. J-12345678-0" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-blue-500" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tipo</label>
                    <select class="w-full border border-gray-300 rounded p-2 text-sm bg-white focus:outline-blue-500">
                        <option>Tecnología</option>
                        <option>Manufactura</option>
                        <option>Servicios</option>
                        <option>Comercio</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tamaño</label>
                    <select class="w-full border border-gray-300 rounded p-2 text-sm bg-white focus:outline-blue-500">
                        <option>Pequeña</option>
                        <option>Mediana</option>
                        <option>Grande</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Estado</label>
                    <!-- Línea 53: Añadimos un ID claro para poder manipularlo con JavaScript -->
                    <select id="selectEstado" class="w-full border border-gray-300 rounded p-2 text-sm bg-white focus:outline-blue-500">
                        <option value="">Cargando estados...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Ciudad</label>
                    <select id="selectCiudad" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 text-gray-500 focus:outline-blue-500" disabled>
                        <option value="">Seleccione primero un estado...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Dirección Específica</label>
                    <textarea rows="2" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-blue-500" placeholder="Calle, Centro Comercial, Oficina..."></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded text-sm transition shadow">
                    Solicitar Afiliación
                </button>
            </form>
        </section>

        <!-- SECCIÓN DERECHA: Filtros y Resultados -->
        <section class="md:col-span-2 space-y-6">
            <!-- Barra de Filtros -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Ciudad</label>
                    <select class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white">
                        <option>Todas las ciudades</option>
                        <option>Caracas</option><option>Chacao</option><option>Baruta</option><option>Los Teques</option>
                        <option>Maracay</option><option>Valencia</option><option>Maracaibo</option><option>Punto Fijo</option>
                        <option>Barquisimeto</option><option>Mérida</option><option>San Cristóbal</option><option>Acarigua</option>
                        <option>Puerto La Cruz</option><option>Lechería</option><option>Maturín</option>
                        <option>Ciudad Guayana (Puerto Ordaz)</option><option>Porlamar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tamaño</label>
                    <select class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white">
                        <option>Todos los tamaños</option>
                        <option>Pequeña</option>
                        <option>Mediana</option>
                        <option>Grande</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tipo</label>
                    <select class="w-full border border-gray-300 rounded p-1.5 text-xs bg-white">
                        <option>Todos los tipos</option>
                        <option>Tecnología</option>
                        <option>Manufactura</option>
                        <option>Servicios</option>
                        <option>Comercio</option>
                    </select>
                </div>
                <button class="sm:col-span-3 bg-blue-800 hover:bg-blue-900 text-white font-medium py-2 px-4 rounded text-sm transition shadow flex items-center justify-center gap-1">
                    🔍 Buscar Empresas
                </button>
            </div>

            <!-- Resultados -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-gray-500">Resultados comerciales</h3>
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded-full">0 Encontradas</span>
                </div>
                <div class="text-center py-12 text-gray-400 text-sm">
                    No se han realizado búsquedas o no hay empresas registradas bajo estos criterios.
                </div>
            </div>
        </section>
    </main>

    <!-- SOLUCIÓN DEL ERROR MEDIANTE UN SCRIPT DE TIPO MÓDULO -->
    <script type="module">
        const selectEstado = document.getElementById('selectEstado');
        const selectCiudad = document.getElementById('selectCiudad');

        // Línea 208 Corregida: Ahora el navegador acepta top-level awaits gracias a type="module"
        try {
            const respuesta = await fetch('/api/estados');
            
            if (!respuesta.ok) {
                throw new Error(`HTTP Error: ${respuesta.status}`);
            }
            
            const estados = await respuesta.json();
            
            // Habilitamos el selector de estados de forma interactiva
            selectEstado.innerHTML = '<option value="">Seleccione un estado...</option>';
            
            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.id || estado.nombre;
                option.textContent = estado.nombre;
                selectEstado.appendChild(option);
            });

            // Agregamos el escuchador de cambios para cargar las ciudades del estado seleccionado
            selectEstado.addEventListener('change', async (e) => {
                const estadoSeleccionado = e.target.value;
                if (!estadoSeleccionado) {
                    selectCiudad.innerHTML = '<option value="">Seleccione primero un estado...</option>';
                    selectCiudad.disabled = true;
                    selectCiudad.className = "w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 text-gray-500";
                    return;
                }

                selectCiudad.innerHTML = '<option value="">Cargando ciudades...</option>';
                selectCiudad.disabled = true;

                try {
                    const resCiudades = await fetch(`/api/ciudades?estado=${estadoSeleccionado}`);
                    if (!resCiudades.ok) throw new Error();
                    const ciudades = await resCiudades.json();

                    selectCiudad.innerHTML = '<option value="">Seleccione una ciudad...</option>';
                    selectCiudad.disabled = false;
                    selectCiudad.className = "w-full border border-gray-300 rounded p-2 text-sm bg-white text-gray-800 focus:outline-blue-500";

                    ciudades.forEach(ciudad => {
                        const option = document.createElement('option');
                        option.value = ciudad.id || ciudad.nombre;
                        option.textContent = ciudad.nombre;
                        selectCiudad.appendChild(option);
                    });
                } catch (err) {
                    selectCiudad.innerHTML = '<option value="">Error al cargar ciudades</option>';
                }
            });

        } catch (error) {
            console.error("Error al establecer la conexión con Neon:", error);
            if (selectEstado) {
                selectEstado.innerHTML = '<option value="">Error al cargar base de datos</option>';
                selectEstado.className = "w-full border border-red-300 rounded p-2 text-sm bg-red-50 text-red-700";
            }
        }
    </script>
</body>
</html>
