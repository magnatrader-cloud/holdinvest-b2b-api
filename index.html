<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdinvest B2B - Panel de Control</title>
    <link href="https://cloudflare.com" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-blue-900 text-white shadow-md py-6 mb-8">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">💼 BIDAccess <span class="text-blue-300 font-light">B2B/B2C Platform</span></h1>
            <span class="bg-green-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">API Conectada</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 pb-12">
        
        <!-- SECCIÓN DE REGISTRO -->
        <section class="bg-white p-6 rounded-2xl shadow border border-gray-100 h-fit">
            <h2 class="text-lg font-bold text-gray-900 mb-4">➕ Registrar Nueva Empresa</h2>
            <form id="formRegistrar" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Razón Social</label>
                    <input type="text" id="razon_social" required placeholder="Ej. Inversiones Alfa C.A." class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Identificador Fiscal (RIF/NIT)</label>
                    <input type="text" id="identificador_fiscal" required placeholder="Ej. J-12345678-0" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Tipo</label>
                        <select id="tipo_empresa" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                            <option value="Tecnología">Tecnología</option>
                            <option value="Manufactura">Manufactura</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Comercio">Comercio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Tamaño</label>
                        <select id="tamano_empresa" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                            <option value="Pequeña">Pequeña</option>
                            <option value="Mediana">Mediana</option>
                            <option value="Grande">Grande</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Ciudad</label>
                    <select id="id_ciudad" required class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                        <option value="">Seleccione una ciudad...</option>
                        <option value="1">Caracas</option>
                        <option value="2">Chacao</option>
                        <option value="3">Baruta</option>
                        <option value="4">Los Teques</option>
                        <option value="9">Maracay</option>
                        <option value="12">Valencia</option>
                        <option value="16">Maracaibo</option>
                        <option value="21">Punto Fijo</option>
                        <option value="22">Barquisimeto</option>
                        <option value="26">Mérida</option>
                        <option value="28">San Cristóbal</option>
                        <option value="35">Acarigua</option>
                        <option value="38">Puerto La Cruz</option>
                        <option value="39">Lechería</option>
                        <option value="41">Maturín</option>
                        <option value="44">Ciudad Guayana (Puerto Ordaz)</option>
                        <option value="48">Porlamar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1">Dirección Específica</label>
                    <input type="text" id="direccion_especifica" placeholder="Ej. Av. Francisco de Miranda" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition text-sm shadow">
                    Solicitar Afiliación
                </button>
            </form>
            <div id="mensajeRegistro" class="mt-3 text-xs hidden text-center font-medium p-2 rounded-lg"></div>
        </section>
        <!-- SECCIÓN DE BÚSQUEDA Y RESULTADOS POR CIUDAD -->
        <section class="md:col-span-2 space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow border border-gray-100 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-3 items-center flex-1">
                    <!-- Campo corregido exclusivamente para Ciudad -->
                    <input type="text" id="filtroCiudad" placeholder="Filtrar por Ciudad..." class="px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm min-w-[150px]">
                    <select id="filtroTamano" class="px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm bg-white">
                        <option value="">Todos los tamaños</option>
                        <option value="Pequeña">Pequeña</option>
                        <option value="Mediana">Mediana</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
                <button id="btnBuscar" class="bg-blue-800 hover:bg-blue-900 text-white text-sm font-medium px-5 py-2 rounded-lg transition shadow block">
                    🔍 Buscar Empresas
                </button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Resultados comerciales</h3>
                    <span id="contadorResultados" class="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full">0 Encontradas</span>
                </div>
                <div id="gridResultados" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>
    <script>
        // Dirección asignada a tu Web Service de Backend (-1)
        const API_BASE_URL = 'https://onrender.com';

        document.addEventListener('DOMContentLoaded', () => {
            buscarEmpresas();
        });

        // LÓGICA DE BÚSQUEDA CORREGIDA PARA CIUDAD
        async function buscarEmpresas() {
            const ciudad = document.getElementById('filtroCiudad').value;
            const tamano = document.getElementById('filtroTamano').value;
            const grid = document.getElementById('gridResultados');
            const contador = document.getElementById('contadorResultados');

            grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-8">Cargando ecosistema...</div>';

            try {
                let url = `${API_BASE_URL}/empresas/buscar?`;
                if (ciudad) url += `ciudad=${encodeURIComponent(ciudad)}&`;
                if (tamano) url += `tamano=${encodeURIComponent(tamano)}`;

                const response = await fetch(url);
                const resultado = await response.json();

                contador.innerText = `${resultado.total_resultados || 0} Encontradas`;
                grid.innerHTML = '';

                if (!resultado.datos || resultado.datos.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-gray-400 bg-white p-8 rounded-xl border border-dashed border-gray-200">No se encontraron empresas.</div>';
                    return;
                }

                resultado.datos.forEach(empresa => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-5 rounded-2xl shadow border border-gray-100 hover:shadow-md transition flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-blue-50 text-blue-700 font-semibold text-xs px-2.5 py-1 rounded-md mb-2 inline-block">${empresa.tipo_empresa}</span>
                                <span class="text-xs text-gray-400 font-medium">${empresa.tamano_empresa}</span>
                            </div>
                            <h4 class="font-bold text-gray-900 text-base mb-1">${empresa.razon_social}</h4>
                            <p class="text-xs text-gray-500 mb-3">RIF/NIT: ${empresa.identificador_fiscal}</p>
                            <div class="space-y-1 text-xs text-gray-600 border-t pt-3 border-gray-50">
                                <p class="flex items-center gap-1">📍 <span class="font-medium">${empresa.nombre_ciudad}</span>, ${empresa.nombre_estado}</p>
                                <p class="flex items-center gap-1">🏢 Gremio: <span class="font-medium text-blue-600">${empresa.gremio_afiliado}</span></p>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error al buscar empresas:', error);
                grid.innerHTML = '<div class="col-span-full text-center text-red-500 bg-red-50 p-6 rounded-xl border border-red-200">Error al conectar con la base de datos comercial.</div>';
            }
        }

        // LÓGICA DE REGISTRO
        document.getElementById('formRegistrar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('mensajeRegistro');
            
            const payload = {
                razon_social: document.getElementById('razon_social').value,
                identificador_fiscal: document.getElementById('identificador_fiscal').value,
                tipo_empresa: document.getElementById('tipo_empresa').value,
                tamano_empresa: document.getElementById('tamano_empresa').value,
                id_ciudad: document.getElementById('id_ciudad').value
            };

            msgDiv.className = "mt-3 text-xs text-center font-medium p-2 rounded-lg bg-gray-100 text-gray-600 block";
            msgDiv.innerText = "Procesando afiliación comercial...";

            try {
                const response = await fetch(`${API_BASE_URL}/empresas/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error inesperado en el registro');
                }

                msgDiv.className = "mt-3 text-xs text-center font-medium p-2 rounded-lg bg-green-50 text-green-700 block";
                msgDiv.innerText = "¡Solicitud registrada con éxito! Correo de notificación despachado.";
                
                document.getElementById('formRegistrar').reset();
                buscarEmpresas();

            } catch (err) {
                msgDiv.className = "mt-3 text-xs text-center font-medium p-2 rounded-lg bg-red-50 text-red-700 block";
                msgDiv.innerText = err.message;
            }
        });

        document.getElementById('btnBuscar').addEventListener('click', buscarEmpresas);
        document.getElementById('filtroCiudad').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarEmpresas();
        });
        document.getElementById('filtroTamano').addEventListener('change', buscarEmpresas);
    </script>
</body>
</html>

    </script>

</body>
</html>
