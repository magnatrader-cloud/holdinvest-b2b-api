<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holdinvest B2B - Panel de Control</title>
    <!-- Tailwind CSS para diseño estético y responsive -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Encabezado Principal -->
    <header class="bg-indigo-900 text-white shadow-md py-6 mb-8">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">💼 Holdinvest <span class="text-indigo-300 font-light">B2B Platform</span></h1>
            <span class="bg-emerald-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">API Conectada</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8 pb-12">
        
        <!-- COLUMNA 1: Formulario para Agregar Empresas (POST) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                ➕ Registrar Nueva Empresa
            </h2>
            <form id="formRegistrar" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Razón Social</label>
                    <input type="text" id="razon_social" required placeholder="Ej. Inversiones Alfa C.A." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Identificador Fiscal (RIF/NIT)</label>
                    <input type="text" id="identificador_fiscal" required placeholder="Ej. J-12345678-0" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Tipo</label>
                        <select id="tipo_empresa" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm bg-white">
                            <option value="Tecnología">Tecnología</option>
                            <option value="Manufactura">Manufactura</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Comercio">Comercio</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Tamaño</label>
                        <select id="tamano_empresa" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm bg-white">
                            <option value="Pequeña">Pequeña</option>
                            <option value="Mediana">Mediana</option>
                            <option value="Grande">Grande</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">ID Ciudad Piloto</label>
                    <input type="number" id="id_ciudad" value="1" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Dirección Específica</label>
                    <input type="text" id="direccion_especifica" placeholder="Ej. Av. Francisco de Miranda" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm shadow-sm">
                    Guardar Afiliación
                </button>
            </form>
            <div id="mensajeRegistro" class="mt-3 text-xs hidden text-center font-medium p-2 rounded-lg"></div>
        </section>

        <!-- COLUMNA 2 y 3: Búsqueda y Resultados Estéticos (GET) -->
        <section class="lg:grid-cols-2 lg:col-span-2 space-y-6">
            
            <!-- Barra de Filtros -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-3 items-center flex-1">
                    <input type="text" id="filtroRegion" placeholder="Filtrar por Región..." class="px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm min-w-[150px]">
                    <select id="filtroTamano" class="px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500 text-sm bg-white">
                        <option value="">Todos los tamaños</option>
                        <option value="Pequeña">Pequeña</option>
                        <option value="Mediana">Mediana</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
                <button id="btnBuscar" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-5 py-2 rounded-lg transition shadow-sm">
                    🔍 Buscar Empresas
                </button>
            </div>

            <!-- Contenedor de Tarjetas Visuales -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Resultados comerciales</h3>
                    <span id="contadorResultados" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full">0 Encontradas</span>
                </div>
                <div id="gridResultados" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Las tarjetas estéticas se inyectarán aquí con JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <!-- Lógica de Conexión Frontend-Backend con JavaScript -->
    <script>
        const API_BASE_URL = 'https://onrender.com';

        // 🔍 Función para Buscar y Mostrar Empresas Estéticamente
        async function buscarEmpresas() {
            const region = document.getElementById('filtroRegion').value;
            const tamano = document.getElementById('filtroTamano').value;
            const grid = document.getElementById('gridResultados');
            const contador = document.getElementById('contadorResultados');

            grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-8">Cargando ecosistema comercial...</div>';

            try {
                // Construir URL con parámetros de filtro
                let url = `${API_BASE_URL}/empresas/buscar?`;
                if (region) url += `region=${encodeURIComponent(region)}&`;
                if (tamano) url += `tamano=${encodeURIComponent(tamano)}`;

                const response = await fetch(url);
                const resultado = await response.json();

                if (!response.ok) throw new Error(resultado.error || 'Error en consulta');

                contador.innerText = `${resultado.total_resultados} Encontradas`;
                grid.innerHTML = '';

                if (resultado.datos.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-400 bg-white p-8 rounded-xl border border-dashed">No se encontraron empresas con los filtros aplicados.</div>';
                    return;
                }

                // Inyectar tarjetas estéticas
                resultado.datos.forEach(empresa => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-indigo-50 text-indigo-700 font-semibold text-xs px-2.5 py-1 rounded-md">${empresa.tipo_empresa || 'Comercial'}</span>
                                <span class="text-slate-400 text-xs font-mono font-medium">${empresa.identificador_fiscal}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-base mb-1">${empresa.razon_social}</h4>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mb-4">
                                📍 ${empresa.nombre_ciudad}, ${empresa.nombre_estado} (${empresa.nombre_region})
                            </p>
                        </div>
                        <div class="border-t border-slate-50 pt-3 flex justify-between items-center text-xs">
                            <span class="text-slate-400">Escala: <strong class="text-slate-600 font-medium">${empresa.tamano_empresa}</strong></span>
                            <span class="px-2 py-0.5 rounded font-medium ${empresa.gremio_afiliado === 'NO AFILIADO' ? 'bg-slate-100 text-slate-500' : 'bg-amber-50 text-amber-700'}">
                                🛡️ ${empresa.gremio_afiliado}
                            </span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
